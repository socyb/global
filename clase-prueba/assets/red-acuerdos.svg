<?xml version="1.0" encoding="UTF-8"?>
<svg class="red" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="redTitle redDesc">
<title id="redTitle">Red de tratados de libre comercio de México, octubre de 2026</title>
<desc id="redDesc">México en el centro. Seis acuerdos de varios países (T-MEC, Unión Europea, AELC, TIPAT, Centroamérica y Alianza del Pacífico) y ocho acuerdos bilaterales unen a México con 52 países. Resaltados: Estados Unidos, Japón, Alemania y España. Solo el T-MEC y el TIPAT tienen capítulo laboral vigente; el acuerdo modernizado con la Unión Europea lo incorpora. China, Corea del Sur e India no tienen tratado.</desc>

